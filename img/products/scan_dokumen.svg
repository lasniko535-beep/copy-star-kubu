<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="scanBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="scanLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <filter id="scanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#scanBg)"/>
  
  <!-- Flatbed Scanner Device -->
  <g transform="translate(100, 50)">
    <!-- Scanner Base Shell -->
    <rect x="20" y="20" width="400" height="240" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="40" y="40" width="360" height="200" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- Glass Bed -->
    <rect x="50" y="50" width="340" height="180" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.9"/>

    <!-- Document Being Scanned -->
    <g transform="translate(110, 60) rotate(2)">
      <rect width="210" height="155" rx="4" fill="#ffffff" opacity="0.95"/>
      <rect x="20" y="20" width="60" height="12" rx="2" fill="#3b82f6"/>
      <line x1="20" y1="45" x2="190" y2="45" stroke="#94a3b8" stroke-width="3"/>
      <line x1="20" y1="65" x2="170" y2="65" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="20" y1="85" x2="185" y2="85" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="20" y1="105" x2="150" y2="105" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="20" y1="125" x2="180" y2="125" stroke="#cbd5e1" stroke-width="2.5"/>
    </g>

    <!-- Glowing Scan Light Beam -->
    <rect x="45" y="110" width="350" height="50" fill="url(#scanLight)" opacity="0.85"/>
    <line x1="45" y1="110" x2="395" y2="110" stroke="#38bdf8" stroke-width="4" filter="url(#scanGlow)"/>
    <line x1="45" y1="110" x2="395" y2="110" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Floating PDF & Email Icons Output -->
  <g transform="translate(450, 150)">
    <!-- PDF Badge -->
    <rect width="130" height="110" rx="12" fill="#ef4444" stroke="#f87171" stroke-width="2" filter="url(#scanGlow)"/>
    <path d="M 35 30 L 75 30 L 95 50 L 95 90 L 35 90 Z" fill="#ffffff"/>
    <path d="M 75 30 L 75 50 L 95 50 Z" fill="#cbd5e1"/>
    <text x="65" y="78" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">PDF</text>
    
    <!-- WhatsApp / Email Send Arrow -->
    <circle cx="110" cy="95" r="20" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <path d="M 102 95 L 118 95 M 112 89 L 118 95 L 112 101" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 25)">
    <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">SCAN HIGH RESOLUTION</text>
  </g>
</svg>
