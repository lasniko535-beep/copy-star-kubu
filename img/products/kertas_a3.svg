<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="a3Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="a3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#a3Bg)"/>

  <!-- Large A3 Sheet Presentation -->
  <g transform="translate(100, 30)" filter="url(#a3Shadow)">
    <!-- Shadow Sheet -->
    <rect x="15" y="15" width="450" height="290" rx="4" fill="#090d16" opacity="0.5"/>
    
    <!-- Big White A3 Paper Sheet -->
    <rect x="0" y="0" width="450" height="290" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Architectural / Engineering Grid Plot on A3 Paper -->
    <g transform="translate(30, 30)" opacity="0.75">
      <rect width="390" height="230" fill="none" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="0" y1="50" x2="390" y2="50" stroke="#bae6fd" stroke-width="1"/>
      <line x1="0" y1="100" x2="390" y2="100" stroke="#bae6fd" stroke-width="1"/>
      <line x1="0" y1="150" x2="390" y2="150" stroke="#bae6fd" stroke-width="1"/>
      <line x1="0" y1="200" x2="390" y2="200" stroke="#bae6fd" stroke-width="1"/>

      <line x1="100" y1="0" x2="100" y2="230" stroke="#bae6fd" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="230" stroke="#bae6fd" stroke-width="1"/>
      <line x1="300" y1="0" x2="300" y2="230" stroke="#bae6fd" stroke-width="1"/>

      <!-- Floor plan blueprint shapes -->
      <rect x="40" y="70" width="140" height="110" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <rect x="220" y="80" width="130" height="80" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <circle cx="285" cy="120" r="25" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4"/>
    </g>

    <!-- A3 Size Watermark / Stamp -->
    <g transform="translate(310, 205)">
      <rect width="100" height="45" rx="4" fill="#0284c7"/>
      <text x="50" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">A3 SIZE</text>
      <text x="50" y="38" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">29.7 x 42.0 CM</text>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 20)">
    <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">HVS A3 70 GSM BESAR</text>
  </g>
</svg>
