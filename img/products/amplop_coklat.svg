<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="kraftBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="kraftBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="kraftFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="envShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#kraftBg)"/>

  <!-- Stack of Brown Kraft Envelopes (Pack of 10) -->
  <g transform="translate(180, 45) rotate(-5)" filter="url(#envShadow)">
    <!-- Back envelopes in the pack -->
    <rect x="-12" y="-10" width="290" height="235" rx="4" fill="#78350f" opacity="0.4"/>
    <rect x="-6" y="-5" width="290" height="235" rx="4" fill="#92400e" opacity="0.6"/>

    <!-- Main Front Envelope (Folio Size) -->
    <rect x="0" y="0" width="290" height="235" rx="6" fill="url(#kraftBrown)" stroke="#f59e0b" stroke-width="1"/>

    <!-- Kraft texture / seam lines -->
    <path d="M 0 0 L 145 120 L 290 0" fill="none" stroke="#78350f" stroke-width="2" opacity="0.5"/>
    <path d="M 0 235 L 145 110 L 290 235" fill="none" stroke="#78350f" stroke-width="2" opacity="0.5"/>

    <!-- Flap with String / Button Tie or Peel & Seal -->
    <polygon points="0,0 290,0 220,70 70,70" fill="url(#kraftFlap)" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Red Seal string washer button -->
    <circle cx="145" cy="55" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="145" cy="55" r="5" fill="#7f1d1d"/>

    <circle cx="145" cy="115" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="145" cy="115" r="5" fill="#7f1d1d"/>

    <!-- String tie wrap around buttons -->
    <path d="M 145 55 L 145 115" stroke="#fef08a" stroke-width="2.5"/>

    <!-- Indonesian "LAMARAN KERJA / BERKAS" print box on envelope -->
    <rect x="25" y="145" width="240" height="65" rx="4" fill="#fef3c7" opacity="0.2" stroke="#fef3c7" stroke-width="1"/>
    <text x="35" y="165" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">KEPADA YTH :</text>
    <line x1="35" y1="180" x2="250" y2="180" stroke="#fef3c7" stroke-width="1" stroke-dasharray="2"/>
    <line x1="35" y1="198" x2="250" y2="198" stroke="#fef3c7" stroke-width="1" stroke-dasharray="2"/>

    <!-- Pack of 10 Badge -->
    <g transform="translate(190, 8)">
      <rect width="85" height="24" rx="12" fill="#1e293b"/>
      <text x="42" y="16" fill="#facc15" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">ISI 10 PCS</text>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 25)">
    <rect width="200" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AMPLOP COKLAT FOLIO</text>
  </g>
</svg>
