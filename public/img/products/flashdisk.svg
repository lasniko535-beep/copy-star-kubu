<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="fdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1e2f"/>
    </linearGradient>
    <linearGradient id="sandiskRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bodyBlack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="usbConnector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="fdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#fdBg)"/>
  
  <!-- Cyber / High-tech grid light accent -->
  <circle cx="320" cy="180" r="150" fill="#ef4444" opacity="0.08"/>
  <circle cx="480" cy="120" r="100" fill="#3b82f6" opacity="0.05"/>

  <!-- Flashdisk Main Model (SanDisk Cruzer Blade compact style) -->
  <g transform="translate(140, 110) rotate(-10)" filter="url(#fdShadow)">
    
    <!-- USB Metal Connector Head -->
    <rect x="20" y="42" width="75" height="56" rx="4" fill="url(#usbConnector)" stroke="#475569" stroke-width="1.5"/>
    <!-- USB contact pins inside connector -->
    <rect x="28" y="52" width="22" height="12" rx="2" fill="#1e293b"/>
    <rect x="28" y="76" width="22" height="12" rx="2" fill="#1e293b"/>
    <rect x="60" y="56" width="6" height="5" fill="#f59e0b"/>
    <rect x="60" y="66" width="6" height="5" fill="#f59e0b"/>
    <rect x="60" y="76" width="6" height="5" fill="#f59e0b"/>

    <!-- Plastic Body - Ergonomic Curve Shape -->
    <!-- Red Accent Inner Lip / Slider / Loop -->
    <path d="M 85 30 L 260 30 C 310 30, 340 55, 340 70 C 340 85, 310 110, 260 110 L 85 110 Z"
          fill="url(#sandiskRed)"/>

    <!-- Black Main Body Casing -->
    <path d="M 85 35 L 230 35 C 270 35, 295 52, 295 70 C 295 88, 270 105, 230 105 L 85 105 Z"
          fill="url(#bodyBlack)" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Lanyard Hole / Keychain loop at rear -->
    <ellipse cx="310" cy="70" rx="14" ry="18" fill="url(#fdBg)" stroke="#ef4444" stroke-width="2"/>

    <!-- SanDisk Brand Logo in Red/White -->
    <text x="145" y="76" fill="#ef4444" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="1">SanDisk</text>
    
    <!-- 32GB Capacity Text -->
    <text x="245" y="75" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14" font-weight="700">32GB</text>

    <!-- Sleek highlight line -->
    <path d="M 100 48 L 220 48" stroke="#52525b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Spec Badges -->
  <g transform="translate(40, 280)">
    <rect width="240" height="42" rx="21" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="120" y="26" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">SANDISK 32GB ORIGINAL</text>
  </g>
</svg>
