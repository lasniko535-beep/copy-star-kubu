<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="photoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#photoBg)"/>

  <!-- Studio Photo Sheet / Paper with Border -->
  <g transform="translate(100, 35)" filter="url(#pShadow)">
    <rect width="440" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Cut guide dashed lines -->
    <line x1="20" y1="20" x2="420" y2="20" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
    <line x1="20" y1="260" x2="420" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>

    <!-- Photos 4x6 (Red Background - Ijazah / Dinas) -->
    <g transform="translate(40, 45)">
      <!-- Photo 1: 4x6 Red -->
      <rect width="90" height="135" rx="3" fill="#dc2626" stroke="#f8fafc" stroke-width="4"/>
      <!-- Silhouette avatar portrait -->
      <circle cx="45" cy="50" r="22" fill="#f8fafc"/>
      <path d="M 20 120 C 20 85, 70 85, 70 120 Z" fill="#f8fafc"/>
      <!-- Size label -->
      <text x="45" y="150" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4 x 6 cm</text>
    </g>

    <g transform="translate(150, 45)">
      <!-- Photo 2: 4x6 Red -->
      <rect width="90" height="135" rx="3" fill="#dc2626" stroke="#f8fafc" stroke-width="4"/>
      <circle cx="45" cy="50" r="22" fill="#f8fafc"/>
      <path d="M 20 120 C 20 85, 70 85, 70 120 Z" fill="#f8fafc"/>
      <text x="45" y="150" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4 x 6 cm</text>
    </g>

    <!-- Photos 3x4 (Blue Background - SKCK / Lamaran) -->
    <g transform="translate(265, 45)">
      <!-- Photo 3: 3x4 Blue -->
      <rect width="70" height="95" rx="3" fill="#2563eb" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="35" cy="38" r="16" fill="#f8fafc"/>
      <path d="M 16 88 C 16 62, 54 62, 54 88 Z" fill="#f8fafc"/>
      <text x="35" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3 x 4 cm</text>
    </g>

    <g transform="translate(345, 45)">
      <!-- Photo 4: 3x4 Blue -->
      <rect width="70" height="95" rx="3" fill="#2563eb" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="35" cy="38" r="16" fill="#f8fafc"/>
      <path d="M 16 88 C 16 62, 54 62, 54 88 Z" fill="#f8fafc"/>
      <text x="35" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3 x 4 cm</text>
    </g>

    <!-- Bottom label strip -->
    <g transform="translate(40, 215)">
      <rect width="360" height="35" rx="6" fill="#f1f5f9"/>
      <text x="180" y="22" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">KERTAS FOTO SILKY DOFF / GLOSSY (ANTI AIR &amp; PUDAR)</text>
    </g>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(30, 20)">
    <rect width="200" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">PAS FOTO 3X4 / 4X6 SET</text>
  </g>
</svg>
