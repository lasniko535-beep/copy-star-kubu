<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="staplerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="metalChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="navyCasing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="boxOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="staplerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#staplerBg)"/>

  <!-- Subtle glow -->
  <circle cx="340" cy="180" r="180" fill="#3b82f6" opacity="0.08"/>

  <!-- Staples box on the side -->
  <g transform="translate(430, 160) rotate(12)" filter="url(#staplerShadow)">
    <rect width="130" height="90" rx="6" fill="url(#boxOrange)"/>
    <rect x="10" y="10" width="110" height="70" rx="4" fill="#ea580c"/>
    <text x="65" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">kangaro</text>
    <rect x="25" y="46" width="80" height="18" rx="9" fill="#ffffff"/>
    <text x="65" y="59" fill="#c2410c" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">STAPLES No. 10</text>
    <text x="65" y="76" fill="#ffedd5" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">1000 STAPLES</text>
  </g>

  <!-- Stapler Device HD-10 -->
  <g transform="translate(100, 70)" filter="url(#staplerShadow)">
    <!-- Base Plate (Bottom) -->
    <path d="M 40 200 L 380 200 C 395 200, 405 210, 400 220 L 390 230 C 385 235, 375 235, 360 235 L 30 235 C 15 235, 10 225, 15 215 L 25 205 C 30 200, 35 200, 40 200 Z"
          fill="url(#navyCasing)"/>
    <rect x="40" y="230" width="340" height="8" rx="4" fill="#0f172a" opacity="0.8"/>
    
    <!-- Anvil Metal Plate on Base -->
    <rect x="70" y="197" width="55" height="6" rx="2" fill="url(#metalChrome)"/>
    <ellipse cx="90" cy="200" rx="8" ry="2" fill="#334155"/>
    <ellipse cx="108" cy="200" rx="8" ry="2" fill="#334155"/>

    <!-- Middle Magazine Metal Channel (where staples slide) -->
    <path d="M 330 195 L 85 185 L 85 160 L 330 170 Z" fill="url(#metalChrome)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Top Cap Handle (The Navy / Blue Press Arm) -->
    <path d="M 370 170 C 380 170, 385 160, 375 140 L 350 95 C 340 78, 320 70, 300 70 L 80 70 C 50 70, 45 95, 50 115 L 55 135 C 60 150, 75 155, 90 155 L 340 165 Z"
          fill="url(#navyCasing)" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- Top grip groove highlight -->
    <path d="M 100 85 L 290 85" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>

    <!-- Brand Kangaro HD-10 on body -->
    <rect x="130" y="98" width="120" height="26" rx="13" fill="#1e3a8a" opacity="0.8"/>
    <text x="190" y="116" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">kangaro HD-10</text>

    <!-- Rear Hinge Pin -->
    <circle cx="355" cy="165" r="12" fill="url(#metalChrome)" stroke="#334155" stroke-width="2"/>
    <circle cx="355" cy="165" r="5" fill="#1e293b"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="23" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">KANGARO HD-10 HEAVY</text>
  </g>
</svg>
