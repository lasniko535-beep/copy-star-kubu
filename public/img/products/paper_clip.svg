<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="clipPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="clipBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="clipYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="clipGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="silverClip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgGrad)"/>
  
  <!-- Desk surface pattern / grid subtle -->
  <circle cx="500" cy="80" r="220" fill="#3b82f6" opacity="0.05"/>
  <circle cx="120" cy="280" r="180" fill="#f59e0b" opacity="0.04"/>

  <!-- Document Paper Sheet in Background -->
  <g transform="translate(140, 40) rotate(-4)" filter="url(#shadow)">
    <rect width="360" height="270" rx="8" fill="#ffffff" opacity="0.95"/>
    <line x1="40" y1="50" x2="200" y2="50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="80" x2="320" y2="80" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="105" x2="300" y2="105" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="130" x2="280" y2="130" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="155" x2="310" y2="155" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="180" x2="240" y2="180" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Big Colorful Paper Clips -->
  <!-- Silver Clip -->
  <path d="M 220 80 L 220 220 A 32 32 0 0 0 284 220 L 284 120 A 20 20 0 0 0 244 120 L 244 200 A 10 10 0 0 0 264 200 L 264 140" 
        fill="none" stroke="url(#silverClip)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#shadow)" transform="rotate(12 250 160)"/>

  <!-- Pink Clip -->
  <path d="M 320 70 L 320 230 A 36 36 0 0 0 392 230 L 392 110 A 22 22 0 0 0 348 110 L 348 210 A 11 11 0 0 0 370 210 L 370 130" 
        fill="none" stroke="url(#clipPink)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#shadow)" transform="rotate(-18 350 160)"/>

  <!-- Blue Clip -->
  <path d="M 430 90 L 430 240 A 34 34 0 0 0 498 240 L 498 120 A 20 20 0 0 0 458 120 L 458 210 A 10 10 0 0 0 478 210 L 478 140" 
        fill="none" stroke="url(#clipBlue)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#shadow)" transform="rotate(8 460 170)"/>

  <!-- Yellow Clip foreground -->
  <path d="M 150 140 L 150 270 A 30 30 0 0 0 210 270 L 210 170 A 18 18 0 0 0 174 170 L 174 250 A 8 8 0 0 0 190 250 L 190 190" 
        fill="none" stroke="url(#clipYellow)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#shadow)" transform="rotate(-35 180 210)"/>

  <!-- Green Clip foreground -->
  <path d="M 470 160 L 470 290 A 30 30 0 0 0 530 290 L 530 190 A 18 18 0 0 0 494 190 L 494 270 A 8 8 0 0 0 510 270 L 510 210" 
        fill="none" stroke="url(#clipGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#shadow)" transform="rotate(25 500 230)"/>

  <!-- Badge box -->
  <g transform="translate(30, 290)">
    <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
    <text x="90" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">JOYKO NO. 3 (100 PCS)</text>
  </g>
</svg>
